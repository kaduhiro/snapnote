<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>snapnote.md</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%25' y='50%25' style='dominant-baseline:central;text-anchor:middle;font-size:90px;'>%F0%9F%93%94</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/mvp.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    /* Sony DESIGN.md tokens (SST unavailable -> Noto Sans JP + Inter substitute) */
    --color-bg: #111111;
    --color-surface: #161616;
    --color-text: #ffffff;
    --color-text-muted: #c8c8c8;
    --color-border: #646464;
    --color-border-light: rgba(200, 200, 200, 0.3);
    --color-link: #3865e0;
    --color-button: #2d75c7;
    --color-danger: #dd0000;
    --radius: 2px;
    --font-ui: "Noto Sans JP", "Inter", Arial, "Helvetica Neue", Meiryo, "Hiragino Kaku Gothic ProN", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-ui);
    margin: 0;
    min-height: 100dvh;
  }
  code { color: whitesmoke; font-family: var(--font-mono); }
  img { max-width: 90dvh; }

  .app {
    display: flex;
    height: 100dvh;
    margin: 0;
    max-width: none;
    padding: 0;
    width: 100dvw;
  }

  /* Sidebar: saved notes list */
  .sidebar {
    background: var(--color-bg);
    border-right: 1px solid var(--color-border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    width: 220px;
  }
  .app.sidebar-hidden .sidebar {
    display: none;
  }
  .sidebar-backdrop {
    display: none;
  }
  .sidebar-header {
    align-items: center;
    border-bottom: 1px solid var(--color-border);
    display: flex;
    justify-content: space-between;
    padding: 12px 14px;
  }
  .sidebar-header .sidebar-title {
    color: var(--color-text);
    font-feature-settings: "palt";
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    opacity: 0.9;
  }
  .icon-btn {
    align-items: center;
    background: transparent;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    color: var(--color-text);
    cursor: pointer;
    display: inline-flex;
    font-family: var(--font-ui);
    font-size: 15px;
    height: 30px;
    justify-content: center;
    line-height: 1;
    padding: 0;
    position: relative;
    transition: background-color 0.15s ease, border-color 0.15s ease;
    width: 30px;
  }
  .icon-btn:hover { background: rgba(255 255 255 / 0.1); }
  .icon-btn[aria-pressed="true"] {
    background: var(--color-text);
    border-color: var(--color-text);
    color: #111111;
  }
  .icon-btn.labeled {
    gap: 6px;
    padding: 0 10px;
    width: auto;
  }
  .icon-btn.labeled .label {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
  }
  .icon-btn.primary {
    background: var(--color-button);
    border: none;
    color: #ffffff;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .icon-btn.primary:hover { background: #3f86dd; }
  .icon-btn.has-changes::after {
    background: var(--color-danger);
    border: 1.5px solid var(--color-surface);
    border-radius: 50%;
    content: '';
    height: 8px;
    position: absolute;
    right: -3px;
    top: -3px;
    width: 8px;
  }
  .icon-btn svg {
    color: currentColor;
    display: block;
    flex-shrink: 0;
    fill: none;
    height: 16px;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
    width: 16px;
  }
  .sidebar-title svg {
    color: currentColor;
    fill: none;
    height: 14px;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
    vertical-align: -2px;
    width: 14px;
  }
  .sidebar-title {
    align-items: center;
    display: inline-flex;
    gap: 6px;
  }
  .note-item-delete svg {
    display: block;
    fill: none;
    height: 14px;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
    width: 14px;
  }
  .notes-list {
    flex: 1;
    list-style: none;
    margin: 0;
    overflow-y: auto;
    padding: 6px;
  }
  .notes-list .empty-hint {
    color: var(--color-text-muted);
    font-size: 12px;
    opacity: 0.6;
    padding: 16px 10px;
    text-align: center;
  }
  .note-item {
    align-items: center;
    border-radius: var(--radius);
    box-shadow: inset 0 2px 0 0 transparent, inset 0 -2px 0 0 transparent;
    display: flex;
    gap: 4px;
    margin-bottom: 2px;
  }
  .note-item:hover { background: rgba(255 255 255 / 0.06); }
  .note-item.active { background: rgba(56, 101, 224, 0.25); }
  .note-item.dragging { opacity: 0.4; }
  .note-item.drag-over-top {
    box-shadow: inset 0 2px 0 0 var(--color-link), inset 0 -2px 0 0 transparent;
  }
  .note-item.drag-over-bottom {
    box-shadow: inset 0 -2px 0 0 var(--color-link), inset 0 2px 0 0 transparent;
  }
  .note-item-name {
    background: transparent;
    border: none;
    color: var(--color-text);
    cursor: pointer;
    flex: 1;
    font-family: var(--font-ui);
    font-size: 13px;
    overflow: hidden;
    padding: 8px 6px;
    text-align: left;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .note-item.active .note-item-name {
    font-weight: 700;
  }
  .note-item-delete {
    background: transparent;
    border: none;
    color: var(--color-text-muted);
    cursor: pointer;
    flex-shrink: 0;
    font-size: 13px;
    line-height: 1;
    opacity: 0;
    padding: 6px 8px;
  }
  .note-item:hover .note-item-delete,
  .note-item:focus-within .note-item-delete {
    opacity: 0.7;
  }
  .note-item-delete:hover { opacity: 1 !important; color: var(--color-danger); }

  /* Main panel */
  .main-panel {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-width: 0;
  }
  .main-panel > header {
    align-items: center;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    color: var(--color-text);
    display: flex;
    gap: 12px;
    justify-content: space-between;
    margin: 0;
    max-width: none;
    padding: 8px 16px;
  }
  .main-panel > header h1 {
    border-radius: var(--radius);
    cursor: pointer;
    font-feature-settings: "palt";
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0;
    opacity: 0.85;
    overflow: hidden;
    padding: 3px 6px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .main-panel > header h1.renamable:hover,
  .main-panel > header h1.renamable:focus-visible {
    background: rgba(255, 255, 255, 0.08);
    opacity: 1;
    outline: none;
  }
  .note-title-input {
    background: var(--color-bg);
    border: 1px solid var(--color-link);
    border-radius: var(--radius);
    color: var(--color-text);
    font: inherit;
    font-size: 15px;
    letter-spacing: 0.02em;
    margin: 0;
    max-width: 320px;
    padding: 3px 6px;
  }
  .header-left {
    align-items: center;
    display: flex;
    gap: 10px;
    min-width: 0;
  }
  .toolbar {
    align-items: center;
    display: flex;
    gap: 10px;
  }
  .toolbar .status {
    color: var(--color-text-muted);
    font-size: 12px;
    opacity: 0.8;
    text-align: right;
    white-space: nowrap;
  }
  .toolbar .divider {
    background: var(--color-border);
    height: 18px;
    opacity: 0.6;
    width: 1px;
  }

  .main-panel > main {
    display: flex;
    flex: 1;
    margin: 0;
    max-width: none;
    min-height: 0;
    padding: 0;
  }
  .main-panel > main > * {
    color: var(--color-text);
    flex: 1 1 0%;
    min-width: 0;
  }
  .main-panel > main > textarea {
    background: transparent;
    border: none;
    border-right: 1px solid var(--color-border);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.5;
    margin: 0;
    max-width: none;
    outline: none;
    padding: 20px;
    resize: none;
  }
  #toggle-preview svg { display: none; }
  #toggle-preview:not([data-mode]) .mode-editor,
  #toggle-preview[data-mode="editor"] .mode-editor,
  #toggle-preview[data-mode="both"] .mode-both,
  #toggle-preview[data-mode="preview"] .mode-preview {
    display: block;
  }
  .main-panel > main.preview-off > textarea {
    border-right: none;
  }
  .main-panel > main.preview-off > output,
  .main-panel > main.preview-off > .resizer,
  .main-panel > main.editor-off > textarea,
  .main-panel > main.editor-off > .resizer {
    display: none;
  }
  .main-panel > main > textarea {
    flex-grow: var(--split, 50);
  }
  .main-panel > main > output {
    flex-grow: calc(100 - var(--split, 50));
  }
  .main-panel > main > .resizer {
    background: transparent;
    cursor: col-resize;
    flex: 0 0 6px;
    margin-left: -3px;
    margin-right: -3px;
    position: relative;
    touch-action: none;
    z-index: 5;
  }
  .main-panel > main > .resizer:hover,
  .main-panel > main > .resizer.dragging {
    background: var(--color-border);
  }
  .main-panel > main.resizing {
    cursor: col-resize;
    user-select: none;
  }
  .main-panel > main.resizing > * {
    pointer-events: none;
  }
  .main-panel > main > output {
    border: none;
    display: block;
    overflow-y: auto;
    padding: 16px 24px;
  }
  .main-panel > main > output.markdown-body {
    background: transparent;
  }
  /* mvp.css sets a global `a { display: inline-block }` which prevents long
     unbroken URLs from wrapping inside list items and instead overflows the
     pane horizontally. Restore normal inline flow so break-word wrapping works. */
  .main-panel > main > output :is(h1, h2, h3, h4, h5, h6, th) {
    color: var(--color-text);
  }
  .main-panel > main > output a {
    display: inline;
  }
  /* mvp.css also forces `input, label { display: block }`, which breaks task
     list checkboxes onto their own line instead of sitting inline before the
     label text. Restore the inline flow markdown-it-task-lists expects. */
  .main-panel > main > output label {
    margin-bottom: 0;
    max-width: none;
  }
  .main-panel > main > output input[type="checkbox"] {
    max-width: none;
  }
  /* Long unbroken labels (URLs, emails) otherwise force the checkbox onto its
     own line before the wrapped text starts. Lay the checkbox and text out
     as a flex row so the checkbox always stays top-aligned with line 1. */
  .main-panel > main > output .task-list-item label {
    align-items: flex-start;
    display: flex;
    gap: 0.4em;
  }
  .main-panel > main > output .task-list-item-checkbox {
    flex-shrink: 0;
    margin: 0.35em 0 0;
  }
  .main-panel > main > output .task-list-item label > * {
    min-width: 0;
  }
  .empty-hint {
    color: var(--color-text-muted);
    opacity: 0.6;
    padding: 20px;
  }

  /* Responsive: narrow / mobile widths. Turn the sidebar into a slide-in
     overlay so it doesn't steal width from the editor, stack the editor and
     preview panes vertically, and tighten up the header. */
  @media (max-width: 760px) {
    .sidebar {
      bottom: 0;
      box-shadow: 2px 0 16px rgba(0, 0, 0, 0.5);
      left: 0;
      position: fixed;
      top: 0;
      width: min(80vw, 280px);
      z-index: 30;
    }
    .app:not(.sidebar-hidden) .sidebar-backdrop {
      background: rgba(0, 0, 0, 0.5);
      bottom: 0;
      display: block;
      left: 0;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 20;
    }
  }
  @media (max-width: 640px) {
    .main-panel > main:not(.preview-off):not(.editor-off) {
      flex-direction: column;
    }
    .main-panel > main > .resizer {
      display: none;
    }
    .main-panel > main:not(.preview-off):not(.editor-off) > textarea {
      border-bottom: 1px solid var(--color-border);
      border-right: none;
    }
    .main-panel > header {
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px;
    }
    .toolbar .status {
      display: none;
    }
    .toolbar {
      gap: 6px;
    }
    .header-left {
      gap: 6px;
    }
  }
  @media (max-width: 420px) {
    .main-panel > header h1 {
      max-width: 40vw;
    }
    .toolbar .divider {
      display: none;
    }
  }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.css">
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2/dist/markdown-it-task-lists.min.js"></script>
</head>
<body>
<div class="app sidebar-hidden" id="app">
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
        Notes
      </span>
      <button type="button" id="new-note" class="icon-btn" title="New note" aria-label="New note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <ul class="notes-list" id="notes-list"></ul>
  </aside>
  <div class="main-panel">
    <header>
      <div class="header-left">
        <button type="button" id="toggle-sidebar" class="icon-btn" aria-pressed="false" title="Show notes list" aria-label="Toggle notes list">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
        </button>
        <h1 id="note-title" tabindex="0" role="button" title="Save the note to rename it">Untitled</h1>
      </div>
      <div class="toolbar">
        <span class="status" id="status"></span>
        <button type="button" id="toggle-preview" class="icon-btn" title="Layout: editor only" aria-label="Toggle layout (editor / both / preview)">
          <svg class="mode-editor" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4"/><path d="m16 8 4 4-4 4"/><path d="m13.5 5-3 14"/></svg>
          <svg class="mode-both" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
          <svg class="mode-preview" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="divider"></div>
        <button type="button" id="save-note" class="icon-btn" title="Save" aria-label="Save">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5V3Z"/><path d="M8 3v6h8V3"/><path d="M8 21v-7h8v7"/></svg>
        </button>
        <button type="button" id="save-as-note" class="icon-btn" title="Save As (new name)" aria-label="Save As (new name)">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 16V5a1 1 0 0 1 1-1h9l5 5v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M9 4v4h6V4"/><line x1="18" y1="18" x2="18" y2="22"/><line x1="16" y1="20" x2="20" y2="20"/></svg>
        </button>
      </div>
    </header>
    <main class="preview-off" id="main">
      <textarea id="editor" spellcheck="false" placeholder="Type Markdown here... (auto-saved locally)"></textarea>
      <div id="resizer" class="resizer" role="separator" aria-orientation="vertical" aria-label="Resize editor and preview" tabindex="0"></div>
      <output id="output" class="markdown-body"></output>
    </main>
  </div>
</div>
<script>
(() => {
  const STORAGE_KEY = 'snapnote.content';
  const IMAGES_KEY = 'snapnote.images';
  const PREVIEW_KEY = 'snapnote.previewEnabled';
  const SAVED_NOTES_KEY = 'snapnote.savedNotes';
  const NOTE_ORDER_KEY = 'snapnote.noteOrder';
  const CURRENT_NOTE_KEY = 'snapnote.currentNoteName';
  const SIDEBAR_KEY = 'snapnote.sidebarVisible';

  const $app = document.getElementById('app');
  const $editor = document.getElementById('editor');
  const $output = document.getElementById('output');
  const $main = document.getElementById('main');
  const $togglePreview = document.getElementById('toggle-preview');
  const $toggleSidebar = document.getElementById('toggle-sidebar');
  const $status = document.getElementById('status');
  const $notesList = document.getElementById('notes-list');
  const $newNote = document.getElementById('new-note');
  const $saveNote = document.getElementById('save-note');
  const $saveAsNote = document.getElementById('save-as-note');
  const $noteTitle = document.getElementById('note-title');

  // markdown-it-task-lists emits GitHub-compatible `task-list-item` /
  // `contains-task-list` classes out of the box, matching what github-markdown-css expects.
  const md = window.markdownit({ html: false, linkify: true, breaks: false })
    .use(window.markdownitTaskLists, { enabled: true, label: true });

  // Open all preview links in a new tab/window instead of navigating away
  // from the note.
  const defaultLinkOpen = md.renderer.rules.link_open
    || ((tokens, idx, options, env, self) => self.renderToken(tokens, idx, options));
  md.renderer.rules.link_open = (tokens, idx, options, env, self) => {
    const token = tokens[idx];
    token.attrSet('target', '_blank');
    token.attrSet('rel', 'noopener noreferrer');
    return defaultLinkOpen(tokens, idx, options, env, self);
  };

  /** @type {Record<number, string>} index -> data URL */
  let images = {};
  let nextImageIndex = 0;
  /** @type {string|null} name of the currently opened saved note, or null for an untitled draft */
  let currentNoteName = null;
  /** @type {string|null} name of the note currently being dragged in the sidebar list */
  let draggedNoteName = null;

  const imagePlaceholder = (index) => `data:image/${index}`;

  const replaceImagePlaceholders = (text) => {
    let result = text;
    for (const index in images) {
      result = result.split(imagePlaceholder(index)).join(images[index]);
    }
    return result;
  };

  const persist = () => {
    try {
      localStorage.setItem(STORAGE_KEY, $editor.value);
      localStorage.setItem(IMAGES_KEY, JSON.stringify(images));
    } catch (err) {
      console.error('Failed to save snapnote to localStorage', err);
    }
  };

  // GitHub renders task list items without wrapping their content in <p>,
  // but markdown-it wraps list item content in <p> when the source list is
  // "loose" (has blank lines between items). Unwrap that single <p> here so
  // spacing matches GitHub's actual output instead of inheriting the normal
  // paragraph margin.
  const unwrapTaskListParagraphs = () => {
    $output.querySelectorAll('li.task-list-item > p').forEach((p) => {
      const li = p.parentElement;
      if (li.children.length === 1) {
        while (p.firstChild) {
          li.insertBefore(p.firstChild, p);
        }
        p.remove();
      }
    });
  };

  const renderPreview = () => {
    if (!$main.classList.contains('preview-off')) {
      $output.innerHTML = $editor.value.trim()
        ? md.render(replaceImagePlaceholders($editor.value))
        : '<p class="empty-hint">Preview will appear here.</p>';
      unwrapTaskListParagraphs();
    }
  };

  const updateStatus = () => {
    const chars = $editor.value.length;
    const words = $editor.value.trim() ? $editor.value.trim().split(/\s+/).length : 0;
    $status.textContent = `${words} words / ${chars} chars`;
  };

  const onEditorChange = () => {
    persist();
    renderPreview();
    updateStatus();
    updateSaveButtonState();
  };

  const PREVIEW_MODES = ['editor', 'both', 'preview'];
  const PREVIEW_MODE_TITLES = {
    editor: 'Layout: editor only (click for editor + preview)',
    both: 'Layout: editor + preview (click for preview only)',
    preview: 'Layout: preview only (click for editor only)',
  };
  let previewMode = 'editor';
  const setPreviewMode = (mode, { save = true } = {}) => {
    previewMode = PREVIEW_MODES.includes(mode) ? mode : 'editor';
    $main.classList.toggle('preview-off', previewMode === 'editor');
    $main.classList.toggle('editor-off', previewMode === 'preview');
    $togglePreview.title = PREVIEW_MODE_TITLES[previewMode];
    $togglePreview.dataset.mode = previewMode;
    if (save) {
      try {
        localStorage.setItem(PREVIEW_KEY, previewMode);
      } catch (err) {
        console.error('Failed to save preview state', err);
      }
    }
    if (previewMode !== 'editor') renderPreview();
  };

  const setSidebarVisible = (visible, { save = true } = {}) => {
    $app.classList.toggle('sidebar-hidden', !visible);
    $toggleSidebar.setAttribute('aria-pressed', String(visible));
    $toggleSidebar.title = visible ? 'Hide notes list' : 'Show notes list';
    if (save) {
      try {
        localStorage.setItem(SIDEBAR_KEY, visible ? '1' : '0');
      } catch (err) {
        console.error('Failed to save sidebar visibility', err);
      }
    }
  };

  const getSavedNotes = () => {
    try {
      const raw = localStorage.getItem(SAVED_NOTES_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (err) {
      console.error('Failed to read saved notes', err);
      return {};
    }
  };

  const setSavedNotes = (notes) => {
    try {
      localStorage.setItem(SAVED_NOTES_KEY, JSON.stringify(notes));
    } catch (err) {
      console.error('Failed to write saved notes', err);
      alert('Failed to save: local storage may be full.');
    }
  };

  // The note order is kept separately from the notes map (whose key order
  // isn't guaranteed to be preserved through JSON round-trips) so the
  // sidebar list can be freely reordered via drag and drop.
  const getNoteOrder = (notes) => {
    let order = [];
    try {
      const raw = localStorage.getItem(NOTE_ORDER_KEY);
      order = raw ? JSON.parse(raw) : [];
    } catch (err) {
      console.error('Failed to read note order', err);
      order = [];
    }
    const known = new Set(Object.keys(notes));
    const filtered = order.filter((name) => known.has(name));
    const missing = Object.keys(notes)
      .filter((name) => !filtered.includes(name))
      .sort((a, b) => a.localeCompare(b));
    return [...filtered, ...missing];
  };

  const setNoteOrder = (order) => {
    try {
      localStorage.setItem(NOTE_ORDER_KEY, JSON.stringify(order));
    } catch (err) {
      console.error('Failed to write note order', err);
    }
  };

  const reorderNotes = (draggedName, targetName, placeAfter) => {
    if (draggedName === targetName) return;
    const notes = getSavedNotes();
    const order = getNoteOrder(notes).filter((name) => name !== draggedName);
    let targetIndex = order.indexOf(targetName);
    if (targetIndex === -1) targetIndex = order.length - 1;
    order.splice(targetIndex + (placeAfter ? 1 : 0), 0, draggedName);
    setNoteOrder(order);
    renderNotesList();
  };

  const setCurrentNoteName = (name) => {
    currentNoteName = name;
    try {
      if (name) localStorage.setItem(CURRENT_NOTE_KEY, name);
      else localStorage.removeItem(CURRENT_NOTE_KEY);
    } catch (err) {
      console.error('Failed to persist current note name', err);
    }
    $noteTitle.textContent = name || 'Untitled';
    $noteTitle.classList.toggle('renamable', Boolean(name));
    $noteTitle.title = name ? 'Click to rename' : 'Save the note to rename it';
    renderNotesList();
    updateSaveButtonState();
  };

  const renameNote = (oldName, newName) => {
    const trimmed = newName.trim();
    if (!trimmed || trimmed === oldName) return false;

    const notes = getSavedNotes();
    if (!notes[oldName]) return false;
    if (notes[trimmed] && !confirm(`"${trimmed}" already exists. Overwrite it?`)) return false;

    const orderBefore = getNoteOrder(notes);

    notes[trimmed] = notes[oldName];
    delete notes[oldName];
    setSavedNotes(notes);

    const order = orderBefore
      .filter((name) => name !== trimmed)
      .map((name) => (name === oldName ? trimmed : name));
    setNoteOrder(order);

    if (currentNoteName === oldName) {
      setCurrentNoteName(trimmed);
    } else {
      renderNotesList();
    }
    return true;
  };

  const startRenameTitle = () => {
    if (!currentNoteName) return;
    const oldName = currentNoteName;

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'note-title-input';
    input.value = oldName;
    input.maxLength = 200;
    input.setAttribute('aria-label', 'Rename note');
    $noteTitle.replaceWith(input);
    input.focus();
    input.select();

    let finished = false;
    const finish = (commit) => {
      if (finished) return;
      finished = true;
      input.removeEventListener('blur', onBlur);
      input.removeEventListener('keydown', onKeydown);
      if (commit) renameNote(oldName, input.value);
      input.replaceWith($noteTitle);
    };
    const onBlur = () => finish(true);
    const onKeydown = (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        finish(true);
      } else if (event.key === 'Escape') {
        event.preventDefault();
        finish(false);
      }
    };
    input.addEventListener('blur', onBlur);
    input.addEventListener('keydown', onKeydown);
  };

  const renderNotesList = () => {
    const notes = getSavedNotes();
    const names = getNoteOrder(notes);
    $notesList.innerHTML = '';

    if (names.length === 0) {
      const hint = document.createElement('li');
      hint.className = 'empty-hint';
      hint.textContent = 'No saved notes yet';
      $notesList.appendChild(hint);
      return;
    }

    for (const name of names) {
      const li = document.createElement('li');
      li.className = 'note-item' + (name === currentNoteName ? ' active' : '');
      li.draggable = true;

      li.addEventListener('dragstart', (event) => {
        draggedNoteName = name;
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', name);
        requestAnimationFrame(() => li.classList.add('dragging'));
      });
      li.addEventListener('dragend', () => {
        draggedNoteName = null;
        li.classList.remove('dragging');
        for (const item of $notesList.querySelectorAll('.note-item')) {
          item.classList.remove('drag-over-top', 'drag-over-bottom');
        }
      });
      li.addEventListener('dragover', (event) => {
        if (!draggedNoteName || draggedNoteName === name) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        const rect = li.getBoundingClientRect();
        const placeAfter = event.clientY - rect.top > rect.height / 2;
        li.classList.toggle('drag-over-bottom', placeAfter);
        li.classList.toggle('drag-over-top', !placeAfter);
      });
      li.addEventListener('dragleave', () => {
        li.classList.remove('drag-over-top', 'drag-over-bottom');
      });
      li.addEventListener('drop', (event) => {
        event.preventDefault();
        li.classList.remove('drag-over-top', 'drag-over-bottom');
        if (!draggedNoteName || draggedNoteName === name) return;
        const rect = li.getBoundingClientRect();
        const placeAfter = event.clientY - rect.top > rect.height / 2;
        reorderNotes(draggedNoteName, name, placeAfter);
      });

      const nameBtn = document.createElement('button');
      nameBtn.type = 'button';
      nameBtn.className = 'note-item-name';
      nameBtn.textContent = name;
      nameBtn.title = name;
      nameBtn.addEventListener('click', () => loadNote(name));

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'note-item-delete';
      deleteBtn.title = `Delete "${name}"`;
      deleteBtn.setAttribute('aria-label', `Delete "${name}"`);
      deleteBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>';
      deleteBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        deleteNote(name);
      });

      li.appendChild(nameBtn);
      li.appendChild(deleteBtn);
      $notesList.appendChild(li);
    }
  };

  const saveAsNote = () => {
    const notes = getSavedNotes();
    const defaultName = currentNoteName || '';
    const name = prompt('Save as (note name):', defaultName);
    if (!name) return;

    if (notes[name] && !confirm(`"${name}" already exists. Overwrite it?`)) return;

    notes[name] = {
      content: $editor.value,
      images,
      savedAt: new Date().toISOString(),
    };
    setSavedNotes(notes);
    setCurrentNoteName(name);
  };

  const saveNote = () => {
    if (!currentNoteName) {
      saveAsNote();
      return;
    }
    const notes = getSavedNotes();
    notes[currentNoteName] = {
      content: $editor.value,
      images,
      savedAt: new Date().toISOString(),
    };
    setSavedNotes(notes);
    renderNotesList();
    updateSaveButtonState();
  };
  const hasUnsavedChanges = () => {
    if (!currentNoteName) return $editor.value.trim() !== '';

    const notes = getSavedNotes();
    const note = notes[currentNoteName];
    if (!note) return $editor.value.trim() !== '';

    return (
      (note.content || '') !== $editor.value ||
      JSON.stringify(note.images || {}) !== JSON.stringify(images)
    );
  };

  const updateSaveButtonState = () => {
    const unsaved = hasUnsavedChanges();
    const shortcutLabel = `${modKeyLabel}${isMac ? '' : '+'}S`;
    $saveNote.classList.toggle('primary', unsaved);
    $saveNote.classList.toggle('has-changes', unsaved);
    $saveNote.title = unsaved ? `Save (unsaved changes) (${shortcutLabel})` : `Save (${shortcutLabel})`;
    $saveNote.setAttribute('aria-label', unsaved ? 'Save (unsaved changes)' : 'Save');
  };

  const loadNote = (name) => {
    const notes = getSavedNotes();
    const note = notes[name];
    if (!note) return;
    if (name === currentNoteName) return;

    if (hasUnsavedChanges() && !confirm('You have unsaved changes. Load will replace the current note content. Continue?')) return;

    $editor.value = note.content || '';
    images = note.images ? { ...note.images } : {};
    const indices = Object.keys(images).map(Number).filter((n) => !Number.isNaN(n));
    nextImageIndex = indices.length ? Math.max(...indices) + 1 : 0;
    setCurrentNoteName(name);
    onEditorChange();
  };

  const deleteNote = (name) => {
    if (!confirm(`Delete saved note "${name}"? This cannot be undone.`)) return;

    const notes = getSavedNotes();
    delete notes[name];
    setSavedNotes(notes);

    if (name === currentNoteName) {
      $editor.value = '';
      images = {};
      nextImageIndex = 0;
      setCurrentNoteName(null);
      onEditorChange();
    } else {
      renderNotesList();
    }
  };

  const newNote = () => {
    if (hasUnsavedChanges() && !confirm('You have unsaved changes. Start a new note anyway?')) return;
    $editor.value = '';
    images = {};
    nextImageIndex = 0;
    setCurrentNoteName(null);
    onEditorChange();
    $editor.focus();
  };


  const restore = () => {
    try {
      const savedText = localStorage.getItem(STORAGE_KEY);
      if (savedText != null) $editor.value = savedText;

      const savedImages = localStorage.getItem(IMAGES_KEY);
      if (savedImages) {
        images = JSON.parse(savedImages);
        const indices = Object.keys(images).map(Number).filter((n) => !Number.isNaN(n));
        nextImageIndex = indices.length ? Math.max(...indices) + 1 : 0;
      }

      const savedPreview = localStorage.getItem(PREVIEW_KEY);
      // '1' / '0' are legacy boolean values
      const legacy = { '1': 'both', '0': 'editor' };
      setPreviewMode(legacy[savedPreview] || savedPreview, { save: false });

      const savedSidebar = localStorage.getItem(SIDEBAR_KEY);
      setSidebarVisible(savedSidebar === '1', { save: false });

      const savedCurrentName = localStorage.getItem(CURRENT_NOTE_KEY);
      const notes = getSavedNotes();
      currentNoteName = savedCurrentName && notes[savedCurrentName] ? savedCurrentName : null;
      $noteTitle.textContent = currentNoteName || 'Untitled';
    } catch (err) {
      console.error('Failed to restore snapnote from localStorage', err);
    }
    updateStatus();
    updateSaveButtonState();
  };

  const SPLIT_KEY = 'snapnote.splitRatio';
  const $resizer = document.getElementById('resizer');
  const clampSplit = (v) => Math.min(80, Math.max(20, v));
  const setSplit = (v, save = true) => {
    const ratio = clampSplit(v);
    $main.style.setProperty('--split', String(ratio));
    if (save) {
      try { localStorage.setItem(SPLIT_KEY, String(ratio)); } catch (err) { console.error('Failed to save split', err); }
    }
    return ratio;
  };
  const savedSplit = parseFloat(localStorage.getItem(SPLIT_KEY));
  if (!Number.isNaN(savedSplit)) setSplit(savedSplit, false);
  $resizer.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    $resizer.setPointerCapture(e.pointerId);
    $resizer.classList.add('dragging');
    $main.classList.add('resizing');
  });
  $resizer.addEventListener('pointermove', (e) => {
    if (!$resizer.hasPointerCapture(e.pointerId)) return;
    const rect = $main.getBoundingClientRect();
    setSplit(((e.clientX - rect.left) / rect.width) * 100);
  });
  const endDrag = (e) => {
    if ($resizer.hasPointerCapture(e.pointerId)) $resizer.releasePointerCapture(e.pointerId);
    $resizer.classList.remove('dragging');
    $main.classList.remove('resizing');
  };
  $resizer.addEventListener('pointerup', endDrag);
  $resizer.addEventListener('pointercancel', endDrag);
  $resizer.addEventListener('dblclick', () => setSplit(50));
  $resizer.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const cur = parseFloat($main.style.getPropertyValue('--split')) || 50;
    setSplit(cur + (e.key === 'ArrowRight' ? 2 : -2));
  });

  $editor.addEventListener('input', onEditorChange);

  $togglePreview.addEventListener('click', () => {
    setPreviewMode(PREVIEW_MODES[(PREVIEW_MODES.indexOf(previewMode) + 1) % PREVIEW_MODES.length]);
  });

  $toggleSidebar.addEventListener('click', () => {
    setSidebarVisible($app.classList.contains('sidebar-hidden'));
  });

  const $sidebarBackdrop = document.getElementById('sidebar-backdrop');
  $sidebarBackdrop.addEventListener('click', () => {
    setSidebarVisible(false);
  });

  $newNote.addEventListener('click', newNote);
  $saveNote.addEventListener('click', saveNote);
  $saveAsNote.addEventListener('click', saveAsNote);
  $noteTitle.addEventListener('click', startRenameTitle);
  $noteTitle.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      startRenameTitle();
    }
  });

  const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.platform);
  const modKeyLabel = isMac ? '\u2318' : 'Ctrl+';
  $saveAsNote.title = `Save As (new name) (${modKeyLabel}${isMac ? '' : '+'}Shift+S)`;
  $saveAsNote.setAttribute('aria-label', $saveAsNote.title);

  document.addEventListener('keydown', (event) => {
    const hasModifier = event.metaKey || event.ctrlKey;
    if (!hasModifier || event.key.toLowerCase() !== 's') return;
    event.preventDefault();
    if (event.shiftKey) {
      saveAsNote();
    } else {
      saveNote();
    }
  });

  window.addEventListener('beforeunload', (event) => {
    if ($editor.value.trim()) {
      event.preventDefault();
      event.returnValue = '';
    }
  });

  document.addEventListener('paste', async (event) => {
    const files = Array.from(event.clipboardData ? event.clipboardData.files : []);
    const imageFiles = files.filter((file) => file.type.startsWith('image/'));
    if (imageFiles.length === 0) return;

    event.preventDefault();

    for (const file of imageFiles) {
      const index = nextImageIndex;
      nextImageIndex += 1;

      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });

      images[index] = dataUrl;

      const value = $editor.value;
      const start = $editor.selectionStart;
      const end = $editor.selectionEnd;
      const before = value.slice(0, start);
      const after = value.slice(end);
      const text = `![${file.name || 'pasted-image'}](${imagePlaceholder(index)})`;
      $editor.value = `${before}${text}${after}`;

      const caret = start + text.length;
      $editor.setSelectionRange(caret, caret);
    }

    onEditorChange();
  });

  restore();
  renderNotesList();
})();
</script>
</body>
</html>
